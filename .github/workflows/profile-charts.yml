name: Refresh profile charts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-charts.yml'
      - 'scripts/refresh_charts.py'
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: profile-charts

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Generate charts
        env:
          PROFILE_GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/refresh_charts.py
      - name: Publish updated snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh GitHub profile charts'
          git push
